name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build dist/valv.html (and validate no external references)
        run: npm run build

      - name: Unit tests — crypto, format, BIP39, i18n
        run: node test/roundtrip.mjs

      - name: Install E2E dependencies
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: E2E — round-trip invariant in Chromium
        run: node test/e2e.mjs
        env:
          REQUIRE_E2E: '1'

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: valv.html
          path: dist/valv.html
